name: cracow-ors-spike
services:
  ors:
    image: openrouteservice/openrouteservice:v10.0.1@sha256:b2f66b5e33949e86a279f3de654ef99e2964eb9112d16fb52788c6bb63ff941c
    container_name: cracow-ors-spike
    restart: unless-stopped
    ports:
      - "127.0.0.1:18082:8082"
    mem_limit: 12g
    cpus: 6
    environment:
      REBUILD_GRAPHS: "False"
      CONTAINER_LOG_LEVEL: INFO
      ORS_CONFIG_LOCATION: /home/ors/config/ors-config.yml
      XMS: 2g
      XMX: 8g
    volumes:
      - ./input:/home/ors/files:ro
      - ./config:/home/ors/config
      - graphs:/home/ors/graphs
      - elevation:/home/ors/elevation_cache
      - logs:/home/ors/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/ors/v2/health"]
      interval: 15s
      timeout: 5s
      start_period: 30m
      retries: 3
volumes:
  graphs:
  elevation:
  logs:
