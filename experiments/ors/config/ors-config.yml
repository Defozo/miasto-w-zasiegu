server:
  port: 8082
ors:
  engine:
    init_threads: 1
    graphs_data_access: RAM_STORE
    elevation:
      provider: multi
      cache_path: /home/ors/elevation_cache
      data_access: MMAP
    profile_default:
      enabled: false
      graph_path: /home/ors/graphs
      build:
        source_file: /home/ors/files/malopolskie-latest.osm.pbf
        elevation: true
    profiles:
      driving-car:
        enabled: false
      wheelchair:
        enabled: true
        encoder_name: wheelchair
        build:
          elevation: true
          encoder_options:
            block_fords: true
          ext_storages:
            WayCategory:
            WaySurfaceType:
            Wheelchair:
              kerbs_on_crossings: true
            OsmId:
